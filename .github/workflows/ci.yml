name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libsqlite3-dev doctest-dev \
            zsh fish

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Compile application and test suite
        run: cmake --build build

      - name: Run the tests, the smoke script and the completion checks
        run: ctest --test-dir build --output-on-failure

      - name: Verify reported version matches VERSION
        run: |
          expected="$(tr -d '[:space:]' < VERSION)"
          actual="$(./build/catalist --version)"
          echo "VERSION=$expected  --version=$actual"
          case "$actual" in
            *"$expected"*) ;;
            *) echo "catalist --version does not report $expected"; exit 1 ;;
          esac

  sanitizers:
    runs-on: ubuntu-latest

    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libsqlite3-dev doctest-dev

      - name: Configure CMake with AddressSanitizer and UBSan
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Compile application and test suite
        run: cmake --build build

      - name: Execute automated unit tests under sanitizers
        run: ctest --test-dir build --output-on-failure
